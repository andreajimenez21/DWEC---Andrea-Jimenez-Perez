
<!--
Ejercicio 3 (String)

Nota: en este bloque no es obligatorio crear un fichero externo con el script; se puede incluir directamente en el HTML.

Crea un script que reciba una cadena de texto. El script elimina todos los espacios a los lados y
comprueba si la cadena contiene la palabra "JavaScript", ya sea en mayúsculas o minúsculas.
- Si no la contiene, devuelve un mensaje indicando que no la encontró.
- Si la encuentra, el usuario deberá adivinar en qué posición empieza esta cadena. Cada vez que el
  usuario falle, el script le dará pistas e indicará si la posición es mayor o menor hasta que acierte.
  Cuando acierte, el script mostrará el número de intentos realizados y el resto de la cadena después
  de la palabra "JavaScript".
-->
<!DOCTYPE html>
<html>
	<script>
		const PALABRABUSCADA = "JavaScript";

		// Pedir al usuario que ingrese una cadena de texto
		let cadena = prompt("Introduce una cadena de texto:");
    
		// Eliminar los espacios al principio y al final de la cadena
		cadena = cadena.trim();
							
		// Buscar la posición de la palabra "JavaScript" (sin importar mayúsculas/minúsculas)
		let posicionCorrecta = cadena.toLowerCase().indexOf(PALABRABUSCADA.toLowerCase());
		
		// Si la palabra "JavaScript" no está en la cadena, informar al usuario
		if (posicionCorrecta === -1) {
			alert(`¡Ups! La palabra '${PALABRABUSCADA}' no está en la cadena.`);
			
		} else {
			// Mostrar mensaje de inicio para adivinar la posición
			alert(`¡Intenta adivinar en qué posición está la palabra '${PALABRABUSCADA}' en la cadena!`);
			
			// Crear un ciclo donde el usuario intenta adivinar la posición
			let adivinanza = -1;
			let intentos = 0;
			
			while (adivinanza !== posicionCorrecta) {
				// Pedir al usuario que adivine la posición
				adivinanza = parseInt(prompt(`¿En qué posición empieza la palabra '${PALABRABUSCADA}' (índice)?`));
				intentos++;
				
				// Verificar si la adivinanza es correcta
				if (adivinanza === posicionCorrecta) {
					alert(`¡Felicidades! Has adivinado correctamente en ${intentos} intentos.`);
					
					// Mostrar el resto de la cadena después de la palabra buscada ("JavaScript" en el enunciado)
					let restoCadena = cadena.slice(posicionCorrecta + PALABRABUSCADA.length);
					alert(`El resto de la cadena a partir de '${PALABRABUSCADA}' es: ${restoCadena}`);

				} else if (adivinanza < posicionCorrecta) {
					alert("La posición correcta es mayor. Intenta de nuevo.");
				} else {
					alert("La posición correcta es menor. Intenta de nuevo.");
				}
			}
		}	
	</script>
</html>
