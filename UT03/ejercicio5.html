<!--
Ejercicio 5 (Acceso y modificación documento HTML)

Crea una página en HTML con el siguiente contenido:

<h2>Nombre del alumno</h2>
<p id="notaFinal">Resultado de la evaluación:</p>
<div class="mensaje"></div>

El HTML pide al usuario con prompt su nombre y apellidos y una calificación de 0 a 10 (se validará que
el número introducido es correcto). El script sobrescribe la página y añade la siguiente información:
- En la etiqueta h2 se añade el nombre del alumno.
- En el párrafo con identificador "notaFinal" se añade una etiqueta strong con el texto
  "Nota: ${calificación}", siendo la calificación el número introducido por teclado.
- En el div con la clase mensaje se muestra un texto indicando si la nota es SUSPENSO (menor que 5),
  APROBADO (entre 5 y 6), BIEN (de 6 a 7), NOTABLE (de 7 a 9) y SOBRESALIENTE (de 9 en adelante).

El script debe emplear al menos una vez los métodos y propiedades getElementById, querySelector,
getElementsByTagName, innerHTML y textContent.

IMPORTANTE: Añade el script al final del HTML del body. Más adelante se estudiará el motivo.
-->
</body>
